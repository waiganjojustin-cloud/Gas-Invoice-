<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Invoice Manager</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>🧾 Simple Invoice Manager</h1>
<p>Create, save and print invoices</p>
</header>

<main>

<div class="card">

<h2>Customer Details</h2>

<div class="form-group">
<label>Customer Name</label>
<input type="text" id="customerName" placeholder="Peter Irungu">
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="text" id="customerPhone" placeholder="0720448044">
</div>

<hr>

<h2>Invoice Items</h2>

<div class="item-inputs">

<input type="text" id="itemName" placeholder="Item Name">

<input type="number" id="itemQty" placeholder="Qty" min="1">

<input type="number" id="itemPrice" placeholder="Price" min="1">

<button id="addItem">Add Item</button>

</div>

<table>

<thead>

<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Action</th>
</tr>

</thead>

<tbody id="invoiceItems"></tbody>

</table>

<div class="summary">

<h3>Total: Ksh <span id="grandTotal">0</span></h3>

</div>

<div class="buttons">

<button id="saveInvoice">Save Invoice</button>
<button id="printInvoice">Print Invoice</button>

</div>

</div>

<div class="card">

<h2>Saved Invoices</h2>

<div id="savedInvoices"></div>

</div>

</main>

<script src="script.js"></script>

</body>
</html>
